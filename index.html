    jobs = range(len(p))
    return sorted(jobs, key=lambda j: p[j] / w[j])

    t, total = 0, 0
    for j in seq:
        t += p[j]
        total += w[j] * t
    return total


def main():
    p = [8, 3, 5, 2, 6]
    w = [4, 6, 3, 7, 2]
